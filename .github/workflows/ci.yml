name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a still-running run for the same branch/PR once a newer commit
# lands, instead of letting both finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite (packages, api, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # apps/web's own devDependencies (vite@8, vitest@4) declare
          # engines requiring Node >=20 - vitest's CLI hard-crashes on
          # Node 18 at startup ("SyntaxError: The requested module
          # 'node:util' does not provide an export named 'styleText'",
          # an export Node only added at 20.12/21.7+). Node 18 (matching
          # the Dockerfiles, see build-web below) is fine for `vite build`
          # itself but not for running the test suite - confirmed live by
          # watching this exact job fail on Node 18 and pass on Node 22.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # apps/api's tsc build fails with a flood of unrelated-looking errors
      # (implicit-any params, missing properties, "ApplicationRole" not
      # exported by "@prisma/client", ...) if the Prisma Client's generated
      # types are missing - and `npm ci` does not reliably generate them by
      # itself in every environment (relies on @prisma/client's postinstall
      # script actually running, which some npm configurations/registries
      # block). Generating explicitly removes that ambiguity rather than
      # hoping postinstall did its job.
      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      # The root `test` script first builds every package/plugin apps/api's
      # own tests load at runtime (build:packages), then runs every
      # workspace's own `test` script in dependency order (core ->
      # openehr-engine -> plugin-api -> openehr-architect-mcp ->
      # formbuilder-mcp-server -> api -> web). None of these require a
      # running database or EHRbase instance - the api/http-layer tests
      # mock the service layer directly rather than hitting Postgres, and
      # the dedicated `test:integration:ehrbase` script (real EHRbase
      # required) is intentionally NOT part of this - confirmed locally by
      # running the full suite with no DATABASE_URL set at all.
      - name: Run test suite
        run: npm test

  build-web:
    name: Production build (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Mirrors Dockerfile.web's build stage exactly, so a build that would
      # break the production Docker image fails here first. This step was
      # added after discovering `npm run build` in apps/web was actually
      # broken on main (a worker chunk's CJS/ESM interop failed under
      # Rollup only in production, not in the Vite dev server) - fixed in
      # the same change that introduced this workflow.
      - name: Build core package
        run: npm run build --workspace=core

      - name: Build react-form-builder2 (vendored, built lib consumed by apps/web)
        run: npm run build:lib --workspace=react-form-builder2

      - name: Build all other packages/plugins apps/web depends on
        run: npm run build:packages

      - name: Build apps/web (tsc -b && vite build)
        run: npm run build --workspace=web
