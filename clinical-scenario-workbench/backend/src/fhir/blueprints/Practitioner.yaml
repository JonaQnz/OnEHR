  - path: name.0.given.0
    label: Vorname
    type: text
    required: false
    editable: true
    sourcePolicy: generated
  - path: qualification.0.code.text
    label: Fachrichtung
    type: text
    required: false
    editable: true
    sourcePolicy: generated
