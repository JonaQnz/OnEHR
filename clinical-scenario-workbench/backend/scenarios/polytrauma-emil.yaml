# A richer, real-world case (user-supplied case brief, 2026-09-16): a
# polytrauma after a motorcycle accident spanning 7 real stations over
# several weeks - Präklinik, Schockraum, two separate OPs (damage control,
# then definitive fracture care), Intensivstation, Normalstation, and
# finally Reha. Deliberately exercises the generic `ward-transfer` event
# type (not just the LAE demo's two implicit stops) and reuses
# `request-imaging` twice under different scenarioKeys for two genuinely
# different bookable procedures (a CT before the first OP, an OP-planning
# slot before the second) - the case brief's own "Termine vor Aufenthalten"
# instruction, i.e. every admission that plausibly needed a prior booking
# gets one, invented where the brief didn't spell out exact times.
#
# Every station below names a `location.kind` - scenario/protocol.ts's
# `expandScenario` (run automatically by loader.ts on every load) turns
# that into a real admission/discharge/periodic-monitoring ruleset for
# free: this file only ever hand-authors the ONE clinically-specific fact
# a generic ruleset can't invent (the actual primary diagnosis text) -
# every routine vitals check is generated by the station's own kind, not
# typed out here event by event.
scenarioId: polytrauma-emil

patient:
  key: patient-emil
  firstName: Emil
  lastName: Sinclair
  sex: male
  age: 35
  birthDate: 1991-04-12

events:
  # Präklinik (11.05., ~09:00-19:00) - Rettungsdienst nach Hochrasanztrauma.
  - id: arrival
    type: patient-arrival
    at: 0h
    data:
      encounterStatus: arrived
      classCode: EMER
      location:
        key: location-praeklinik
        name: Präklinik
        description: Rettungsdienst · präklinische Versorgung nach Hochrasanztrauma
        kind: prehospital
      staff:
        scenarioKey: practitioner-praeklinik-1
        family: Falkner
        given: Moritz
        qualification: Notarzt

  # Schockraum / Notaufnahme (11.05., ~09:00-19:00) - Trauma-Team.
  - id: schockraum
    type: ward-transfer
    at: 0h
    data:
      encounterStatus: triaged
      location:
        key: location-schockraum
        name: Schockraum / Notaufnahme
        description: Trauma-Team · Schockraumversorgung nach ATLS
        kind: trauma-bay
      staff:
        scenarioKey: practitioner-schockraum-1
        family: Reinhardt
        given: Sophie
        qualification: Fachärztin für Unfallchirurgie

  - id: primary-diagnosis
    type: anamnesis
    at: 1h
    data:
      diagnosis: Polytrauma mit hämorrhagischem Schock (V.a. Milzruptur, instabiles Becken, offene Femurfraktur, Hämatopneumothorax)

  # (The initial shock vitals the brief's own narrative describes are now
  # auto-generated by the Schockraum's own trauma-bay protocol - see the
  # file's own header comment - rather than hand-authored here.)

  # Invented "Termin vor Aufenthalt" #1: the brief's own narrative mentions
  # a Ganzkörper-CT steering the imaging/OP priorities, even though the raw
  # timeline table jumps straight to OP - a real booked appointment fits
  # exactly between Schockraum and OP.
  - id: ct-scan
    type: request-imaging
    at: 2h
    data:
      serviceKey: service-ct-imaging
      serviceName: CT-Diagnostik
      scheduleKey: schedule-ct-today
      capabilityKey: ct-imaging
      comment: Ganzkörper-CT (Thorax/Abdomen/Becken) bei Polytrauma
      skipLocationTransfer: true # the OP ward-transfer right after already covers the physical move

  # OP / Damage Control (11.05.-12.05., 10h) - lebensrettende Erstversorgung.
  - id: op-damage-control
    type: ward-transfer
    at: 3h
    data:
      encounterStatus: in-progress
      location:
        key: location-op
        name: OP
        description: Operationssaal · Notfall- und Folgeeingriffe
        kind: surgery
      staff:
        scenarioKey: practitioner-op-damage-control-1
        family: Brandt
        given: Lukas
        qualification: Facharzt für Unfallchirurgie (Damage Control)

  # Intensivstation (12.05.-20.05., 8 Tage) - Beatmung, Kreislauf, Organmonitoring.
  - id: icu
    type: ward-transfer
    at: 27h
    data:
      location:
        key: location-intensiv
        name: Intensivstation
        description: ICU · Beatmung, Kreislaufunterstützung, Organfunktionsüberwachung
        kind: intensive-care
      staff:
        scenarioKey: practitioner-icu-1
        family: Weiß
        given: Anna
        qualification: Fachärztin für Intensivmedizin

  # (The brief's own "Organversagen und Sepsis im Verlauf" now shows up as
  # several real, independently-timestamped Vitalzeichen compositions -
  # the ICU's own intensive-care protocol generates one on admission, one
  # every 4 declared hours during the stay, and one on discharge, each a
  # genuinely new composition - rather than a single hand-typed reading.)

  # Invented "Termin vor Aufenthalt" #2: the definitive fracture surgery is
  # a planned procedure, not an emergency one - gets its own real booking
  # under a different service/schedule than the CT, so the two never
  # collide in the Entity/Capability Registry.
  - id: op2-scheduling
    type: request-imaging
    at: 200h
    data:
      serviceKey: service-op-planning
      serviceName: OP-Planung Unfallchirurgie
      scheduleKey: schedule-op-planning
      capabilityKey: op-planning
      comment: Geplante definitive Osteosynthese Becken/Femur
      skipLocationTransfer: true

  # OP / definitive Versorgung (21.05.-24.05., 3 Tage) - Osteosynthese
  # Becken/Femur. Same physical OP room as the damage-control surgery, a
  # different (real) surgeon - the station legitimately accumulates a
  # second Practitioner.
  - id: op-definitive
    type: ward-transfer
    at: 202h
    data:
      encounterStatus: in-progress
      location:
        key: location-op
        name: OP
        description: Operationssaal · Notfall- und Folgeeingriffe
        kind: surgery
      staff:
        scenarioKey: practitioner-op-definitive-1
        family: Hofmann
        given: Elias
        qualification: Facharzt für Orthopädie und Unfallchirurgie

  # Normalstation (24.05.-07.06., 14 Tage) - Mobilisation, Physiotherapie.
  - id: normalstation
    type: ward-transfer
    at: 274h
    data:
      location:
        key: location-normalstation
        name: Normalstation
        description: Unfallchirurgie · Mobilisation, Physiotherapie, Wundverlauf
        kind: general-ward
      staff:
        scenarioKey: practitioner-normalstation-1
        family: Neumann
        given: Paul
        qualification: Assistenzarzt Chirurgie

  # Reha (ab 08.06.) - Anschlussheilbehandlung, Fallabschluss.
  - id: reha
    type: ward-transfer
    at: 634h
    data:
      encounterStatus: finished
      location:
        key: location-reha
        name: Reha
        description: Rehabilitationsklinik · Anschlussheilbehandlung nach Polytrauma
        kind: rehabilitation
      staff:
        scenarioKey: practitioner-reha-1
        family: Hartmann
        given: Clara
        qualification: Fachärztin für Physikalische und Rehabilitative Medizin
