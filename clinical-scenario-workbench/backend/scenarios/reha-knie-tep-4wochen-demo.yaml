# Third Rehazentrum case (user's own follow-up ask: "einen zweiten etwas
# größeren" - a genuinely bigger, denser 4-week AHB case after a right knee
# TEP, following a detailed data-density brief the user provided as a table
# (data category / cadence / expected record count over 4 weeks).
#
# HONEST LIMITATION, checked against the real system before writing this
# (get_ehrbase_template_webtemplate on vg_pflegebericht.0.1.0): several rows
# of that brief - Schmerz-NRS, Kniebeweglichkeit (ROM), Gehstrecke,
# Hilfsmittel/Mobilitätsstatus, Treppensteigen, Physiotherapie/Therapie-
# ergebnis, and Barthel-Index/Timed-Up-and-Go - have NO backing openEHR
# archetype/Form Section anywhere in this Forms instance today. Pflegebericht
# is genuinely just ONE free-text `progress_note` field, nothing more
# structured. Rather than fabricating fake "structured" capabilities that
# don't really exist (this session's own standards-first principle), those
# rows are folded as real clinical narrative INTO real, existing nursing-
# round/doctor-round/patient-conversation entries, at the cadence the brief
# asked for - genuinely written to EHRbase, just as prose, not as discrete
# coded fields. A system-critique is filed once this run executes, flagging
# the gap for real (same pattern as missing-allergy-history/missing-consent).
# Rows that DO have a real capability (Diagnosen, Vitalwerte, Medikation,
# Ärztlicher Verlauf/doctor-round, Entlassungsbefund) use it directly, at
# the brief's own cadence:
#   Diagnosen            -> coded-diagnosis           x3  (brief: 2-4)
#   Vitalwerte            -> vital-signs                x8  (brief: ~8, 2x/Woche)
#   Medikation            -> medication-order/-medication x4 (brief: 3-5)
#   Ärztlicher Verlauf    -> doctor-round               x4 weekly + 1 discharge
#   Physio/Schmerz/ROM/Gehstrecke/Hilfsmittel/Treppe/Wundstatus
#                         -> nursing-round (Pflegebericht free text) x20
#                            workdays, each entry combining that day's real
#                            values (pain NRS, and on their own designated
#                            sub-cadence: ROM, gait distance, mobility aid,
#                            stairs, wound status) - exactly mirroring how a
#                            real Pflegebericht entry would read today.
