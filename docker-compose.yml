version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: formbuilder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d formbuilder"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://admin:password@db:5432/formbuilder?schema=public
      - EHRBASE_URL=http://ehrbase:8080/ehrbase/rest/openehr/v1
      - DATA_DIR=/app/data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  web:
    # Dev setup with hot reload
    image: node:18-alpine
    working_dir: /app
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
      - PORT=3000
    depends_on:
      - api
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - apps_web_node_modules:/app/apps/web/node_modules
      - apps_api_node_modules:/app/apps/api/node_modules
      - packages_core_node_modules:/app/packages/core/node_modules
      - packages_rfb_node_modules:/app/packages/react-form-builder2/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm run build --workspace=core && npm run build:lib --workspace=react-form-builder2 && cd apps/web && npm run dev -- --host 0.0.0.0 --port 3000 --force"

volumes:
  pgdata:
  node_modules:
  apps_web_node_modules:
  apps_api_node_modules:
  packages_core_node_modules:
  packages_rfb_node_modules:
