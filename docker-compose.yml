version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: formbuilder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d formbuilder"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # Pairs with the process.on('uncaughtException', ...) handler in
    # index.ts: that handler exits deliberately rather than limping on with
    # possibly-corrupted state, and this is what turns that exit into an
    # automatic few-second restart instead of the API staying down.
    restart: unless-stopped
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://admin:password@db:5432/formbuilder?schema=public
      - EHRBASE_URL=http://ehrbase:8080/ehrbase/rest/openehr/v1
      - DATA_DIR=/app/data
      - N8N_API_URL=${N8N_API_URL:-http://host.docker.internal:5678/api/v1}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - N8N_PUBLIC_URL=${N8N_PUBLIC_URL:-http://localhost:5678}
      - N8N_EHRBASE_URL=${N8N_EHRBASE_URL:-http://ehrbase:8080/ehrbase/rest/openehr/v1}
      # First-start admin bootstrap: creates one ADMIN account if (and only if)
      # no ADMIN role exists yet. Safe to leave set after that - it becomes a
      # no-op. Set FORMS_BOOTSTRAP_ADMIN_PASSWORD in a .env file next to this
      # compose file (gitignored); never hardcode a real password here.
      - FORMS_BOOTSTRAP_ADMIN_USERNAME=${FORMS_BOOTSTRAP_ADMIN_USERNAME:-jona.kunze}
      - FORMS_BOOTSTRAP_ADMIN_PASSWORD=${FORMS_BOOTSTRAP_ADMIN_PASSWORD:?Set FORMS_BOOTSTRAP_ADMIN_PASSWORD (12+ chars) in a .env file next to docker-compose.yml before first start}
      - FORMS_BOOTSTRAP_ADMIN_DISPLAY_NAME=${FORMS_BOOTSTRAP_ADMIN_DISPLAY_NAME:-Jona Kunze}
      - FORMS_BOOTSTRAP_ADMIN_EMAIL=${FORMS_BOOTSTRAP_ADMIN_EMAIL:-jona.kunze@vitagroup.ag}
      # HIP / Keycloak login admin override: comma-separated emails (or Keycloak
      # subjects/usernames) that always become ADMIN on HIP login, regardless of
      # what the Keycloak token's own role claims say. Applies (and re-syncs)
      # on every HIP login, not just account creation.
      - FORMS_HIP_ADMIN_EMAILS=${FORMS_HIP_ADMIN_EMAILS:-jona.kunze@vitagroup.ag}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./apps/api/dist:/app/apps/api/dist
      # Keep the runtime Core/openehr-engine packages in sync with the
      # mounted API build. Otherwise API code compiled against newer
      # Core/openehr-engine exports can call an old image layer during
      # local development.
      - ./packages/core/dist:/app/packages/core/dist
      - ./packages/openehr-engine/dist:/app/packages/openehr-engine/dist
      # Prisma schema is mounted so the API container can regenerate its client
      # when local development adds a persisted model.
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./packages/aql-prefill-plugin/dist:/app/packages/aql-prefill-plugin/dist

  web:
    # Dev setup with hot reload
    image: node:18-alpine
    working_dir: /app
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
      - API_URL=http://api:3001
      - PORT=3000
    depends_on:
      - api
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - apps_web_node_modules:/app/apps/web/node_modules
      - apps_api_node_modules:/app/apps/api/node_modules
      - packages_core_node_modules:/app/packages/core/node_modules
      - packages_rfb_node_modules:/app/packages/react-form-builder2/node_modules
      - packages_aql_prefill_node_modules:/app/packages/aql-prefill-plugin/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm run build:packages && npm run build:lib --workspace=react-form-builder2 && cd apps/web && npm run dev -- --host 0.0.0.0 --port 3000 --force"

volumes:
  pgdata:
  node_modules:
  apps_web_node_modules:
  apps_api_node_modules:
  packages_core_node_modules:
  packages_rfb_node_modules:
  packages_aql_prefill_node_modules:
