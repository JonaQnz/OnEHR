# Compose overlay for docker-compose.yml + docker-compose.ehrbase-test.yml.
# Use scripts/debug-ehrbase.sh to start, stop, reset or import templates.
services:
  debug-ehrbase-templates:
    image: curlimages/curl:8.10.1
    depends_on: [ehrbase-test]
    volumes:
      - ./debug/ehrbase/templates:/templates:ro
      - ./debug/ehrbase/import-templates.sh:/import-templates.sh:ro
    entrypoint: ["/bin/sh", "/import-templates.sh"]
    restart: "no"

  api:
    environment:
      DEBUG_EHRBASE_URL: http://ehrbase-test:8080
      DEBUG_EHRBASE_ACTIVE: "true"
    depends_on:
      ehrbase-test:
        condition: service_started
